name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # TensorFlow is deliberately NOT installed here. The correctness-critical logic - data
      # validation, the leakage rules, splitting, preprocessing, selection, metrics - is
      # independent of it, so CI proves that in seconds instead of minutes.
      - name: Install (without the deep extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          mypy src

      - name: Test
        run: pytest -v

      - name: Pipeline smoke test (baselines only)
        run: energy-forecast train --skip-deep

      - name: Script entry points
        run: |
          python scripts/preprocess.py --audit-only
          python scripts/train.py --skip-deep

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: |
            reports/metrics.json
            reports/figures/
            experiments/runs/
          if-no-files-found: ignore
